services:
  - type: web
    name: glamora-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/products
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_AUTH_SECRET
        generateValue: true
      - key: APP_ADMIN_API_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-sandy-seven-87.vercel.app
